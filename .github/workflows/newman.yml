name: Postman API Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1-5"
  workflow_dispatch:

jobs:
  newman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run full collection
        run: npm test

      - name: Run data-driven pet lifecycle
        if: always()
        run: npm run test:data-driven

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/
